<main class="container py-4 parent">
  <header class="d-flex align-items-center gap-3 mb-4">
    <a href="./" class="btn btn-outline theme-secondary" data-i18n="parent.back"></a>
    <h1 class="h3 m-0" data-i18n="parent.title"></h1>
  </header>

  <!-- Phase B sections are added here in order: drawings, transfer, input. -->
  <div id="parent-sections" class="d-flex flex-column gap-4">
    <section id="section-drawings" class="card">
      <div class="card-body d-flex flex-column gap-3">
        <h2 class="h5" data-i18n="parent.drawings"></h2>
        <div class="d-flex flex-wrap align-items-center gap-2">
          <button
            id="drawings-select-all"
            type="button"
            class="btn btn-outline theme-secondary"
            data-i18n="parent.drawings.selectAll"
          ></button>
          <button
            id="drawings-delete"
            type="button"
            class="btn btn-outline theme-danger"
            data-i18n="parent.drawings.delete"
            disabled
          ></button>
          <output id="drawings-count"></output>
        </div>
        <ul id="drawings-list" class="parent-drawings"></ul>
      </div>
    </section>

    <dialog id="delete-dialog" class="dialog dialog-instant" aria-labelledby="delete-dialog-title">
      <div class="dialog-header">
        <h2
          id="delete-dialog-title"
          class="dialog-title h5"
          data-i18n="parent.drawings.confirmTitle"
        ></h2>
      </div>
      <div class="dialog-body">
        <p id="delete-dialog-text" class="m-0"></p>
      </div>
      <div class="dialog-footer">
        <button
          id="delete-cancel"
          type="button"
          class="btn btn-outline theme-secondary"
          data-i18n="common.cancel"
        ></button>
        <button
          id="delete-confirm"
          type="button"
          class="btn btn-solid theme-danger"
          data-i18n="parent.drawings.delete"
        ></button>
      </div>
    </dialog>
    <section id="section-transfer" class="card">
      <div class="card-body d-flex flex-column gap-2">
        <h2 class="h5" data-i18n="parent.transfer"></h2>
        <p class="m-0 text-body-secondary" data-i18n="parent.transfer.help"></p>
        <div class="d-flex flex-wrap gap-2">
          <button
            id="export-drawings"
            type="button"
            class="btn btn-outline theme-primary"
            data-i18n="parent.transfer.export"
          ></button>
          <button
            id="share-export"
            type="button"
            class="btn btn-solid theme-primary"
            hidden
          ></button>
          <label class="btn btn-outline theme-primary">
            <span data-i18n="parent.transfer.import"></span>
            <input
              id="import-files"
              type="file"
              accept="image/png"
              multiple
              class="visually-hidden"
            />
          </label>
        </div>
        <output id="transfer-status"></output>
      </div>
    </section>

    <section id="section-input" class="card">
      <div class="card-body d-flex flex-column gap-3">
        <h2 class="h5" data-i18n="parent.input"></h2>
        <p class="m-0 text-body-secondary" data-i18n="parent.input.help"></p>
        <label class="d-flex align-items-center gap-2">
          <input id="width-filter" type="checkbox" class="check check-lg" />
          <span data-i18n="parent.input.widthFilter"></span>
        </label>
        <label class="d-flex flex-column gap-1">
          <span data-i18n="parent.input.widthThreshold"></span>
          <input
            id="width-threshold"
            type="number"
            min="20"
            max="400"
            step="1"
            class="form-control"
          />
        </label>
        <label class="d-flex flex-column gap-1">
          <span data-i18n="parent.input.releaseDelay"></span>
          <input
            id="release-delay"
            type="number"
            min="0"
            max="3000"
            step="1"
            class="form-control"
          />
        </label>
        <div>
          <button
            id="input-defaults"
            type="button"
            class="btn btn-outline theme-secondary"
            data-i18n="parent.input.defaults"
          ></button>
        </div>
      </div>
    </section>

    <section id="section-language" class="card">
      <div class="card-body d-flex flex-column gap-2">
        <h2 class="h5" data-i18n="parent.language"></h2>
        <select id="language-select" class="form-control" data-i18n-aria="parent.language">
          <option value="" data-i18n="parent.language.auto"></option>
          <option value="en" lang="en">English</option>
          <option value="fr" lang="fr">Français</option>
        </select>
      </div>
    </section>

    <section id="section-storage" class="card">
      <div class="card-body d-flex flex-column gap-2">
        <h2 class="h5" data-i18n="parent.storage"></h2>
        <p id="storage-persisted" class="m-0"></p>
        <p id="storage-usage" class="m-0"></p>
        <div>
          <button
            id="storage-persist"
            type="button"
            hidden
            class="btn btn-outline theme-primary"
            data-i18n="parent.storage.persist"
          ></button>
        </div>
      </div>
    </section>

    <section id="section-app" class="card">
      <div class="card-body d-flex flex-column gap-2">
        <h2 class="h5" data-i18n="parent.app"></h2>
        <p id="app-version" class="m-0"></p>
        <div class="d-flex flex-wrap gap-2">
          <button
            id="check-update"
            type="button"
            class="btn btn-outline theme-primary"
            data-i18n="update.check"
          ></button>
          <button
            id="reset-cache"
            type="button"
            class="btn btn-outline theme-danger"
            data-i18n="update.resetCache"
          ></button>
          <a
            href="diagnostic.html"
            class="btn btn-outline theme-secondary"
            data-i18n="parent.diagnostic"
          ></a>
        </div>
        <output id="update-status"></output>
      </div>
    </section>
  </div>
</main>
