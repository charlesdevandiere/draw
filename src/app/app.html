<h1 class="visually-hidden" data-i18n="app.name"></h1>

<section id="draw-screen" class="screen draw-screen">
  <div class="page-area">
    <div id="color-box" class="color-box-area" role="toolbar" data-i18n-aria="tools.colors"></div>
    <div id="page" class="page">
      <canvas id="drawing-layer"></canvas>
    </div>
  </div>
  <div
    id="tools-primary"
    class="tools tools-primary"
    role="toolbar"
    data-i18n-aria="tools.drawing"
  ></div>
  <div
    id="tools-secondary"
    class="tools tools-secondary"
    role="toolbar"
    data-i18n-aria="tools.actions"
  >
    <button
      id="undo"
      class="btn btn-solid btn-pebble theme-history"
      type="button"
      data-i18n-aria="tools.undo"
      disabled
    >
      <span class="icon icon-undo" aria-hidden="true"></span>
    </button>
    <button
      id="redo"
      class="btn btn-solid btn-pebble theme-history"
      type="button"
      data-i18n-aria="tools.redo"
      disabled
    >
      <span class="icon icon-redo" aria-hidden="true"></span>
    </button>
    <button id="mode-button" class="btn btn-solid btn-pebble theme-mode" type="button">
      <span class="icon icon-mode-finger" aria-hidden="true"></span>
    </button>
  </div>
  <div id="tools-pages" class="tools tools-pages" role="toolbar" data-i18n-aria="tools.pages">
    <button
      id="new-page"
      class="btn btn-solid btn-pebble theme-create"
      type="button"
      data-i18n-aria="tools.newPage"
      disabled
    >
      <span class="icon icon-new-page" aria-hidden="true"></span>
    </button>
    <button
      id="open-gallery"
      class="btn btn-solid btn-pebble theme-gallery"
      type="button"
      data-i18n-aria="tools.gallery"
    >
      <span class="icon icon-gallery" aria-hidden="true"></span>
    </button>
  </div>
</section>

<section id="gallery-screen" class="screen gallery-screen" hidden>
  <div class="gallery-header">
    <button
      id="back-to-drawing"
      class="btn btn-solid btn-pebble theme-history"
      type="button"
      data-i18n-aria="gallery.back"
    >
      <span class="icon icon-back" aria-hidden="true"></span>
    </button>
    <button
      id="open-settings"
      class="btn btn-solid btn-pebble theme-hold padlock"
      type="button"
      data-i18n-aria="gallery.settings"
    >
      <span class="icon icon-settings" aria-hidden="true"></span>
    </button>
  </div>
  <div id="gallery-grid" class="gallery-grid"></div>
</section>

<section id="viewer-screen" class="screen viewer-screen" hidden>
  <div class="viewer-top" role="toolbar" data-i18n-aria="viewer.drawing">
    <button
      id="viewer-back"
      class="btn btn-solid btn-pebble theme-history"
      type="button"
      data-i18n-aria="viewer.back"
    >
      <span class="icon icon-back" aria-hidden="true"></span>
    </button>
    <div class="viewer-file">
      <button
        id="viewer-share"
        class="btn btn-solid btn-pebble theme-gallery"
        type="button"
        data-i18n-aria="viewer.share"
      >
        <span class="icon icon-share" aria-hidden="true"></span>
      </button>
      <button
        id="viewer-trash"
        class="btn btn-solid btn-pebble theme-hold trash-hold"
        type="button"
        data-i18n-aria="viewer.trash"
      >
        <span class="icon icon-trash" aria-hidden="true"></span>
      </button>
    </div>
  </div>
  <div class="viewer-stage">
    <div id="viewer-page" class="page">
      <canvas id="viewer-layer" role="button" tabindex="0" data-i18n-aria="viewer.page"></canvas>
    </div>
    <div
      id="viewer-progress"
      class="progress viewer-progress"
      role="progressbar"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
      data-i18n-aria="viewer.progress"
    >
      <div class="progress-bar"></div>
    </div>
  </div>
  <div class="viewer-controls" role="toolbar" data-i18n-aria="viewer.replay">
    <button
      id="viewer-restart"
      class="btn btn-solid btn-pebble theme-mode"
      type="button"
      data-i18n-aria="viewer.restart"
    >
      <span class="icon icon-restart" aria-hidden="true"></span>
    </button>
    <button
      id="viewer-play"
      class="btn btn-solid btn-pebble theme-create viewer-play"
      type="button"
      data-i18n-aria="viewer.pause"
    >
      <span class="icon icon-pause" aria-hidden="true"></span>
    </button>
    <button
      id="viewer-continue"
      class="btn btn-solid btn-pebble theme-continue"
      type="button"
      data-i18n-aria="viewer.continue"
    >
      <span class="icon icon-continue" aria-hidden="true"></span>
    </button>
  </div>
</section>
