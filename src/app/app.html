<svg class="visually-hidden" aria-hidden="true">
  <symbol id="icon-gallery" viewBox="0 0 24 24">
    <rect x="3" y="3" width="7" height="7" rx="1.5" />
    <rect x="14" y="3" width="7" height="7" rx="1.5" />
    <rect x="3" y="14" width="7" height="7" rx="1.5" />
    <rect x="14" y="14" width="7" height="7" rx="1.5" />
  </symbol>
  <symbol id="icon-mode-pen" viewBox="0 0 24 24">
    <path d="M4 20l4.5-1L19 8.5 15.5 5 5 15.5z" />
    <path d="M13.5 7l3.5 3.5" />
  </symbol>
  <symbol id="icon-mode-finger" viewBox="0 0 24 24">
    <path d="M10.5 21V5a1.5 1.5 0 0 1 3 0v16" />
    <path d="M6 21h12" />
  </symbol>
  <symbol id="icon-mode-multi" viewBox="0 0 24 24">
    <path d="M6.5 21V7a1.5 1.5 0 0 1 3 0v14" />
    <path d="M14.5 21V5a1.5 1.5 0 0 1 3 0v16" />
    <path d="M4 21h16" />
  </symbol>
  <symbol id="icon-eraser" viewBox="0 0 24 24">
    <path d="M8.5 20H20" />
    <path
      d="M4.6 15.4l9.9-9.9a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L11 19h-3.6l-2.8-2.8a.6.6 0 0 1 0-.8z"
    />
    <path d="M9.5 10.5l5 5" />
  </symbol>
  <symbol id="icon-back" viewBox="0 0 24 24">
    <path d="M15 5l-7 7 7 7" />
  </symbol>
</svg>

<h1 class="visually-hidden" data-i18n="app.name"></h1>

<section id="draw-screen" class="screen draw-screen">
  <div
    id="tools-primary"
    class="tools tools-primary"
    role="toolbar"
    data-i18n-aria="tools.drawing"
  ></div>
  <div class="page-area">
    <div id="page" class="page">
      <canvas id="drawing-layer"></canvas>
    </div>
  </div>
  <div
    id="tools-secondary"
    class="tools tools-secondary"
    role="toolbar"
    data-i18n-aria="tools.actions"
  >
    <button id="mode-button" class="tool-button" type="button">
      <svg><use href="#icon-mode-finger" /></svg>
    </button>
    <button id="open-gallery" class="tool-button" type="button" data-i18n-aria="tools.gallery">
      <svg><use href="#icon-gallery" /></svg>
    </button>
  </div>
</section>

<section id="gallery-screen" class="screen gallery-screen" hidden>
  <div class="gallery-header">
    <button id="back-to-drawing" class="tool-button" type="button" data-i18n-aria="gallery.back">
      <svg><use href="#icon-back" /></svg>
    </button>
  </div>
  <div id="gallery-grid" class="gallery-grid"></div>
</section>
