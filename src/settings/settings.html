<main class="container settings">
  <header class="settings-header">
    <a
      href="./#gallery"
      class="btn btn-solid btn-pebble theme-history"
      data-replace
      data-i18n-aria="settings.back"
    >
      <span class="icon icon-back" aria-hidden="true"></span>
    </a>
    <h1 class="settings-title" data-i18n="settings.title"></h1>
  </header>

  <!-- In the spec order (phones: one column); wide windows place them in three columns
       (settings.scss), so the focus order is the reading order on phones. -->
  <div id="settings-sections" class="settings-sections">
    <section id="section-backup" class="card">
      <div class="card-body d-flex flex-column gap-3">
        <h2 class="h5 m-0" data-i18n="settings.backup"></h2>
        <p class="m-0 text-body-secondary">
          <span id="backup-summary"></span>
          <span data-i18n="settings.transfer.help"></span>
        </p>
        <button
          id="export-drawings"
          type="button"
          class="btn btn-solid theme-gallery settings-action"
        >
          <span class="icon icon-export" aria-hidden="true"></span>
          <span data-i18n="settings.transfer.export"></span>
        </button>
        <button
          id="share-export"
          type="button"
          class="btn btn-solid theme-gallery settings-action"
          hidden
        ></button>
        <label class="btn btn-solid theme-hold settings-action">
          <span class="icon icon-import" aria-hidden="true"></span>
          <span data-i18n="settings.transfer.import"></span>
          <input
            id="import-files"
            type="file"
            accept="image/png"
            multiple
            class="visually-hidden"
          />
        </label>
        <output id="transfer-status"></output>
      </div>
    </section>
    <section id="section-share" class="card">
      <div class="card-body d-flex flex-column gap-3">
        <h2 class="h5 m-0" data-i18n="settings.share"></h2>
        <p class="m-0 text-body-secondary" data-i18n="settings.share.help"></p>
        <button id="share-app" type="button" class="btn btn-solid theme-create settings-action">
          <span class="icon icon-share" aria-hidden="true"></span>
          <span data-i18n="settings.share.button"></span>
        </button>
        <output id="share-status"></output>
      </div>
    </section>
    <section id="section-trash" class="card">
      <div class="card-body d-flex flex-column gap-3">
        <h2 class="h5 m-0" data-i18n="settings.trash"></h2>
        <p id="trash-summary" class="m-0 text-body-secondary"></p>
        <ul id="trash-list" class="trash-list"></ul>
        <button id="empty-trash" type="button" class="btn settings-action empty-trash" hidden>
          <span class="icon icon-trash" aria-hidden="true"></span>
          <span data-i18n="settings.trash.empty"></span>
        </button>
      </div>
    </section>
    <section id="section-app" class="card">
      <div class="card-body d-flex flex-column gap-3">
        <div class="d-flex align-items-center justify-content-between gap-2">
          <h2 class="h5 m-0" data-i18n="settings.app"></h2>
          <span id="update-badge" class="badge settings-badge" hidden></span>
        </div>
        <p id="app-version" class="m-0 text-body-secondary"></p>
        <button id="check-update" type="button" class="btn btn-solid theme-hold settings-action">
          <span class="icon icon-restart" aria-hidden="true"></span>
          <span data-i18n="update.check"></span>
        </button>
        <button
          id="reset-cache"
          type="button"
          class="btn settings-link"
          data-i18n="update.resetCache"
        ></button>
        <output id="update-status"></output>
      </div>
    </section>
    <section id="section-language" class="card">
      <div class="card-body d-flex flex-column gap-3">
        <h2 class="h5 m-0" data-i18n="settings.language"></h2>
        <label class="d-flex flex-column gap-2">
          <span class="text-body-secondary" data-i18n="settings.language.label"></span>
          <select id="language-select" class="form-control settings-field">
            <option value="" data-i18n="settings.language.auto"></option>
            <option value="en" lang="en">English</option>
            <option value="fr" lang="fr">Français</option>
          </select>
        </label>
      </div>
    </section>
    <section id="section-input" class="card">
      <div class="card-body d-flex flex-column gap-3">
        <h2 class="h5 m-0" data-i18n="settings.input"></h2>
        <p class="m-0 text-body-secondary" data-i18n="settings.input.help"></p>
        <label class="settings-switch">
          <span data-i18n="settings.input.widthFilter"></span>
          <span class="switch switch-lg">
            <input id="width-filter" type="checkbox" role="switch" />
          </span>
        </label>
        <label class="d-flex flex-column gap-2">
          <span class="text-body-secondary" data-i18n="settings.input.widthThreshold"></span>
          <input
            id="width-threshold"
            type="number"
            min="20"
            max="400"
            step="1"
            class="form-control settings-field"
          />
        </label>
        <button
          id="input-defaults"
          type="button"
          class="btn settings-link"
          data-i18n="settings.input.defaults"
        ></button>
      </div>
    </section>
    <section id="section-storage" class="card">
      <div class="card-body settings-persistence">
        <span id="storage-icon" class="icon icon-shield" aria-hidden="true"></span>
        <div class="d-flex flex-column gap-1">
          <p id="storage-persisted" class="m-0"></p>
          <p id="storage-detail" class="m-0 small text-body-secondary"></p>
          <button
            id="storage-persist"
            type="button"
            hidden
            class="btn btn-solid theme-hold settings-action"
            data-i18n="settings.storage.persist"
          ></button>
        </div>
      </div>
    </section>
    <a
      href="diagnostic.html"
      class="settings-diagnostic"
      data-replace
      data-i18n="settings.diagnostic"
    ></a>
  </div>
</main>
